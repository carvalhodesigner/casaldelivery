<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casal Delivery · Cardápio</title>
<style>
:root{--bg:#fbf4ea;--card:#fff;--tx:#2b1a17;--mut:#7a625c;--pri:#a3302c;--pri2:#7d1f1f;--acc:#f5a623;--bd:#ecdcc9;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b0f0f;--card:#2a1817;--tx:#f7ece4;--mut:#bfa59c;--pri:#d9534f;--pri2:#a3302c;--bd:#443029}}
:root[data-theme=dark]{--bg:#1b0f0f;--card:#2a1817;--tx:#f7ece4;--mut:#bfa59c;--pri:#d9534f;--pri2:#a3302c;--bd:#443029}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:100px}
button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:760px;margin:auto;padding:0 16px}
.hero{background:linear-gradient(135deg,#8f1212,#d42a22);box-shadow:0 8px 24px #8f121255;color:#fff;padding:22px 0 30px;border-radius:0 0 28px 28px}
.hero .w{display:flex;align-items:center;gap:14px}
.hero img{width:84px;height:auto;filter:drop-shadow(0 4px 8px #0006);animation:fl 3.5s ease-in-out infinite}
.hero h1{font-size:28px;letter-spacing:-.5px}.hero p{opacity:.9;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:#ffffff26;border-radius:99px;padding:4px 11px;font-size:12.5px}
#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;overflow-x:auto;white-space:nowrap}
#tabs .w{display:flex;gap:8px}
.tb{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 16px;cursor:pointer;transition:.2s;font-weight:600;font-size:14px}
.tb.on{background:var(--pri);border-color:var(--pri);color:#fff;transform:scale(1.05)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;animation:up .45s both;animation-delay:calc(var(--i,0)*45ms)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.card h3{font-size:16px}.card small,.mut{color:var(--mut);font-size:13px}
.pr{font-weight:800;color:var(--pri);white-space:nowrap}
.sz{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sz .card{margin:0;text-align:center;cursor:pointer}.sz b{display:block;font-size:20px;color:var(--pri)}
.btn{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:0 4px 12px #a3302c44}
.btn:active{transform:scale(.94)}.btn.s{padding:8px 14px;border-radius:12px}
.btn.g{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none}
.btn.w2{background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 4px 12px #25d36655}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#2b1a17;font-size:22px;font-weight:800;cursor:pointer;flex:none;transition:.2s}
.add:active{transform:scale(.8) rotate(90deg)}
.cl #sf .add,.cl #sf .sz .card,.cl #sf main .btn{opacity:.45}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
label{font-size:13px;font-weight:700;color:var(--mut)}
#fab{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:728px;margin:auto;z-index:8;display:none;justify-content:space-between;font-size:16px;animation:pop .4s}
#fab.bump{animation:bump .35s}
#ov{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center;animation:fi .2s}
#ov.o{display:flex}
#sh{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sl .3s}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1.5px solid var(--bd);border-radius:14px;margin:6px 0;cursor:pointer;background:var(--card);transition:.15s}
.opt.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.opt .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.opt.on .ck{background:var(--pri);border-color:var(--pri)}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);background:var(--card);cursor:pointer;font-weight:800}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--acc);color:#2b1a17}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--pri));transition:width .6s}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp .card{margin:0;text-align:center}.kp b{font-size:19px;display:block}
#ad{display:none}
.t{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;animation:pop .3s;font-size:14px}
footer{text-align:center;margin:30px 0;font-size:12px}footer a{color:var(--mut)}
